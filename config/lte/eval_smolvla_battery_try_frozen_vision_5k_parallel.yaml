# 100-episode four-worker evaluation for the matching 5k Battery Try control.
launcher:
  mode: smolvla
  task: battery_try
  env_cfg: aloha_agilex
  checkpoint: ~/RMBench-state/checkpoints/smolvla_battery_try_frozen_vision_1gpu_5k/checkpoints/005000/pretrained_model
