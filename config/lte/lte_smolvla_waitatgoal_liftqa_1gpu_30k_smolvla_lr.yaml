# Joint WaitAtGoal + LiftQA LTE_SmolVLA run on one L40S.
#
# This keeps the full-model LTE setup used by the preceding 15k run, but uses
# the pinned SmolVLA optimiser and scheduler defaults rather than the previous
# conservative, differential-LR recipe.
launcher:
  task: waitatgoal_liftqa
  env_cfg: temporal
  experiment_id: 261024_lte_smolvla_waitatgoal_liftqa_30k_smolvla_lr
  num_processes: 1
  cuda_visible_devices: "0"
  conda_env: RMBench
  single_camera: true
  dataset:
    repo_ids: [waitatgoal_v4, liftqa_v2]
    temporal: true
    download: false

args:
  policy.type: lte_smolvla
  policy.base_policy_path: lerobot/smolvla_base
  policy.device: cuda
  policy.push_to_hub: false
  policy.input_features:
    observation.state: {type: STATE, shape: [3]}
    observation.images.camera1: {type: VISUAL, shape: [3, 144, 144]}
  policy.output_features:
    action: {type: ACTION, shape: [3]}

  policy.chunk_size: 30
  policy.n_action_steps: 30
  policy.freeze_vision_encoder: false
  policy.train_expert_only: false
  policy.train_state_proj: true

  # Pinned SmolVLA optimisation defaults.  The whole LTE SmolVLA remains
  # trainable; unlike the old recipe this uses one learning rate for all
  # trainable groups rather than a reduced backbone rate.
  policy.optimizer_lr: 1e-4
  policy.optimizer_betas: [0.9, 0.95]
  policy.optimizer_eps: 1e-8
  policy.optimizer_weight_decay: 1e-10
  policy.optimizer_grad_clip_norm: 10.0
  policy.scheduler_warmup_steps: 1000
  policy.scheduler_decay_steps: 30000
  policy.scheduler_decay_lr: 2.5e-6
  policy.differential_lr: false

  policy.temporal_embedding_cache_refresh_steps: 3000
  policy.temporal_embedding_cache_build_batch_size: 256
  policy.temporal_encode_chunk_size: 256
  policy.temporal_embedding_cache_enabled: true
  policy.temporal_image_cache_on_gpu: true
  policy.temporal_query_history_only: true
  # Keep the auxiliary history target on a controlled scale. This is the LTE
  # model default and prevents its MSE from dominating the action objective.
  policy.temporal_embedding_normalize: true

  batch_size: 16
  dataset.repo_id: lte-multi:waitatgoal_v4,liftqa_v2
  dataset.root: ~/RMBench-state/datasets
  dataset.video_backend: pyav
  output_dir: ../../checkpoints/lte_smolvla_waitatgoal_liftqa_1gpu_30k_smolvla_lr
  job_name: waitatgoal_liftqa_lte_smolvla_1gpu_30k_smolvla_lr
  wandb.enable: true
  wandb.entity: uts_robot_lab
  wandb.project: RMBench
  steps: 30000
  save_freq: 5000
  log_freq: 10
  num_workers: 8
  eval_freq: 0
  seed: 429
  rename_map:
    observation.image: observation.images.camera1
