# Same joint ordinary-SmolVLA control as the 30k recipe, extended to 100k
# updates.  The cosine schedule is extended with the training horizon.
launcher:
  task: battery_try_cover_blocks
  env_cfg: aloha_agilex
  experiment_id: 261028_smolvla_battery_try_cover_blocks_all_trainable_100k
  num_processes: 1
  cuda_visible_devices: "0"
  conda_env: smolvla
  dataset:
    tasks: [battery_try, cover_blocks]
    repo_ids:
      - local/rmbench-battery_try-aloha_agilex-v30
      - local/rmbench-cover_blocks-aloha_agilex-v30
    merge_repo_id: local/rmbench-battery_try-cover_blocks-aloha_agilex-v30
args:
  policy.path: lerobot/smolvla_base
  policy.device: cuda
  policy.push_to_hub: false
  policy.chunk_size: 50
  policy.n_action_steps: 50
  policy.n_obs_steps: 1
  policy.freeze_vision_encoder: false
  policy.train_expert_only: false
  policy.train_state_proj: true
  policy.optimizer_lr: 1e-4
  policy.scheduler_warmup_steps: 1000
  policy.scheduler_decay_steps: 100000
  policy.scheduler_decay_lr: 2.5e-6
  policy.adapt_to_pi_aloha: false
  policy.use_delta_joint_actions_aloha: false
  batch_size: 8
  policy.input_features:
    observation.state: {type: STATE, shape: [14]}
    observation.images.camera1: {type: VISUAL, shape: [3, 240, 320]}
    observation.images.camera2: {type: VISUAL, shape: [3, 240, 320]}
    observation.images.camera3: {type: VISUAL, shape: [3, 240, 320]}
  policy.output_features: {action: {type: ACTION, shape: [14]}}
  dataset.repo_id: local/rmbench-battery_try-cover_blocks-aloha_agilex-v30
  dataset.root: ~/.cache/huggingface/lerobot/local/rmbench-battery_try-cover_blocks-aloha_agilex-v30
  dataset.video_backend: pyav
  output_dir: ../../checkpoints/smolvla_battery_try_cover_blocks_all_trainable_1gpu_100k
  job_name: battery_try_cover_blocks_smolvla_all_trainable_100k
  wandb.enable: true
  wandb.entity: uts_robot_lab
  wandb.project: RMBench
  steps: 100000
  save_freq: 5000
  log_freq: 10
  num_workers: 8
  eval_freq: 0
  seed: 0
  rename_map:
    observation.images.cam_high: observation.images.camera1
    observation.images.cam_left_wrist: observation.images.camera2
    observation.images.cam_right_wrist: observation.images.camera3
