# Full-suite RMBench LTE_SmolVLA recipe.
launcher:
  task: rmbench
  env_cfg: aloha_agilex
  num_processes: 8
  cuda_visible_devices: "0,1,2,3,4,5,6,7"
  dataset:
    download: true
args:
  policy.type: lte_smolvla
  policy.base_policy_path: lerobot/smolvla_base
  policy.device: cuda
  policy.push_to_hub: false
  policy.input_features:
    observation.state: {type: STATE, shape: [14]}
    observation.images.camera1: {type: VISUAL, shape: [3, 240, 320]}
    observation.images.camera2: {type: VISUAL, shape: [3, 240, 320]}
    observation.images.camera3: {type: VISUAL, shape: [3, 240, 320]}
  policy.output_features:
    action: {type: ACTION, shape: [14]}

  policy.chunk_size: 30
  policy.n_action_steps: 30
  policy.freeze_vision_encoder: false
  policy.train_expert_only: false
  policy.train_state_proj: true
  policy.optimizer_lr: 5e-5
  policy.optimizer_weight_decay: 1e-8
  policy.optimizer_grad_clip_norm: 1.0
  policy.scheduler_decay_steps: 60000
  policy.scheduler_decay_lr: 5e-6

  policy.max_causal_history_length: 4096
  policy.temporal_embedding_cache_refresh_steps: 1000
  policy.temporal_embedding_cache_build_batch_size: 256
  policy.temporal_encode_chunk_size: 256
  policy.temporal_embedding_cache_enabled: true
  policy.temporal_image_cache_on_gpu: true
  policy.differential_lr: true

  batch_size: 8
  dataset.repo_id: yinchenghust/rmbench_lerobot
  dataset.root: ~/.cache/huggingface/lerobot/yinchenghust/rmbench_lerobot
  dataset.video_backend: pyav
  output_dir: ../../checkpoints/lte_smolvla_rmbench_8gpu_60k
  job_name: rmbench_lte_smolvla_60k
  wandb.enable: true
  wandb.entity: uts_robot_lab
  wandb.project: RMBench
  steps: 60000
  save_freq: 3000
  log_freq: 10
  num_workers: 32
  eval_freq: 0
  seed: 429
  rename_map:
    observation.images.cam_high: observation.images.camera1
    observation.images.cam_left_wrist: observation.images.camera2
    observation.images.cam_right_wrist: observation.images.camera3
