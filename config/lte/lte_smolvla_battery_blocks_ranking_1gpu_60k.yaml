# Two-task RMBench LTE_SmolVLA recipe, scaled down from the full 8-GPU run.
# It keeps the full-suite optimisation and cache settings, but trains one
# single-GPU process on battery_try and blocks_ranking_try only.
launcher:
  task: battery_try_blocks_ranking_try
  env_cfg: aloha_agilex
  num_processes: 1
  cuda_visible_devices: "0"
  experiment_id: 261024_lte_smolvla_battery_blocks_ranking
  conda_env: RMBench
  dataset:
    # setup_remote.sh downloads and converts these two RMBench task datasets.
    tasks: [battery_try, blocks_ranking_try]
    repo_ids:
      - local/rmbench-battery_try-aloha_agilex-v30
      - local/rmbench-blocks_ranking_try-aloha_agilex-v30

args:
  policy.type: lte_smolvla
  policy.base_policy_path: lerobot/smolvla_base
  policy.device: cuda
  policy.push_to_hub: false
  policy.input_features:
    observation.state: {type: STATE, shape: [14]}
    observation.images.camera1: {type: VISUAL, shape: [3, 240, 320]}
    observation.images.camera2: {type: VISUAL, shape: [3, 240, 320]}
    observation.images.camera3: {type: VISUAL, shape: [3, 240, 320]}
  policy.output_features:
    action: {type: ACTION, shape: [14]}

  policy.chunk_size: 30
  policy.n_action_steps: 30
  policy.freeze_vision_encoder: false
  policy.train_expert_only: false
  policy.train_state_proj: true
  policy.optimizer_lr: 5e-5
  policy.optimizer_weight_decay: 1e-8
  policy.optimizer_grad_clip_norm: 1.0
  policy.scheduler_decay_steps: 60000
  policy.scheduler_decay_lr: 5e-6

  policy.max_causal_history_length: 4096
  policy.temporal_embedding_cache_refresh_steps: 1000
  policy.temporal_embedding_cache_build_batch_size: 256
  policy.temporal_encode_chunk_size: 256
  policy.temporal_embedding_cache_enabled: true
  policy.temporal_image_cache_on_gpu: true
  policy.differential_lr: true

  # This is the per-process batch size from the 8-GPU full-suite recipe.
  batch_size: 8
  dataset.repo_id: lte-multi:local/rmbench-battery_try-aloha_agilex-v30,local/rmbench-blocks_ranking_try-aloha_agilex-v30
  # LTEMultiLeRobotDataset appends each repository ID to this common root.
  dataset.root: ~/.cache/huggingface/lerobot
  dataset.video_backend: pyav
  # The converted blocks_ranking_try video timestamps have ~0.1 ms floating
  # point jitter, marginally exceeding LeRobot's 0.1 ms default tolerance.
  tolerance_s: 0.001
  output_dir: ../../checkpoints/lte_smolvla_battery_blocks_ranking_1gpu_60k
  job_name: battery_blocks_ranking_lte_smolvla_1gpu_60k
  wandb.enable: true
  wandb.entity: uts_robot_lab
  wandb.project: RMBench
  steps: 60000
  save_freq: 3000
  log_freq: 10
  num_workers: 8
  eval_freq: 0
  seed: 429
  rename_map:
    observation.images.cam_high: observation.images.camera1
    observation.images.cam_left_wrist: observation.images.camera2
    observation.images.cam_right_wrist: observation.images.camera3
