# Joint WaitAtGoal + LiftQA LTE_SmolVLA recipe with GPU image and embedding caches.
launcher:
  task: waitatgoal_liftqa
  env_cfg: temporal
  num_processes: 2
  cuda_visible_devices: "0,1"
  conda_env: RMBench
  single_camera: true
  dataset:
    repo_ids: [waitatgoal_v4, liftqa_v2]
args:
  policy.type: lte_smolvla
  policy.base_policy_path: lerobot/smolvla_base
  policy.device: cuda
  policy.push_to_hub: false
  # Canonical schema after multi-dataset state/action padding and image renaming.
  policy.input_features:
    observation.state: {type: STATE, shape: [3]}
    observation.images.camera1: {type: VISUAL, shape: [3, 144, 144]}
  policy.output_features:
    action: {type: ACTION, shape: [3]}

  policy.chunk_size: 30
  policy.n_action_steps: 30
  policy.freeze_vision_encoder: false
  policy.train_expert_only: false
  policy.train_state_proj: true
  policy.optimizer_lr: 5e-5
  policy.optimizer_weight_decay: 1e-8
  policy.optimizer_grad_clip_norm: 1.0
  policy.scheduler_decay_steps: 20000
  policy.scheduler_decay_lr: 5e-6

  policy.temporal_embedding_cache_refresh_steps: 1000
  policy.temporal_embedding_cache_build_batch_size: 256
  policy.temporal_encode_chunk_size: 256
  policy.temporal_embedding_cache_enabled: true
  policy.temporal_image_cache_on_gpu: true
  policy.temporal_query_history_only: true
  policy.temporal_embedding_normalize: false
  policy.differential_lr: true

  batch_size: 16
  dataset.repo_id: lte-multi:waitatgoal_v4,liftqa_v2
  dataset.root: ~/Repos/LTE-DP/datasets
  dataset.video_backend: pyav
  output_dir: ../../checkpoints/lte_smolvla_waitatgoal_liftqa_2gpu_20k
  job_name: waitatgoal_liftqa_lte_smolvla_20k
  wandb.enable: true
  wandb.entity: uts_robot_lab
  wandb.project: RMBench
  steps: 20000
  save_freq: 5000
  log_freq: 10
  num_workers: 8
  eval_freq: 0
  seed: 429
  rename_map:
    observation.image: observation.images.camera1
