# One-step cache extraction probe. The single optimizer update is only a
# vehicle for the standard trainer; the result of interest is the cache-build
# log emitted before step zero. It uses the same Cover Blocks data, cameras,
# base weights, and cache batch size as the paired LTE run.
launcher:
  task: cover_blocks
  env_cfg: aloha_agilex
  experiment_id: 261031_lte_smolvla_cover_blocks_spatial_pool4_cache_extract
  num_processes: 1
  cuda_visible_devices: "0"
  conda_env: smolvla
args:
  policy.type: lte_smolvla
  policy.base_policy_path: lerobot/smolvla_base
  policy.device: cuda
  policy.push_to_hub: false
  policy.chunk_size: 50
  policy.n_action_steps: 50
  policy.n_obs_steps: 1
  policy.freeze_vision_encoder: true
  policy.train_expert_only: true
  policy.train_state_proj: true
  policy.optimizer_lr: 1e-4
  policy.scheduler_warmup_steps: 1
  policy.scheduler_decay_steps: 1
  policy.scheduler_decay_lr: 2.5e-6
  policy.adapt_to_pi_aloha: false
  policy.use_delta_joint_actions_aloha: false
  policy.max_causal_history_length: 2048
  # Pool SmolVLA's 8x8 post-connector token grid to 4x4 spatial cells.
  policy.temporal_spatial_pool_grid_size: 4
  policy.temporal_embedding_cache_enabled: true
  policy.temporal_embedding_cache_build_batch_size: 256
  policy.temporal_image_cache_on_gpu: true
  policy.input_features:
    observation.state: {type: STATE, shape: [14]}
    observation.images.camera1: {type: VISUAL, shape: [3, 240, 320]}
    observation.images.camera2: {type: VISUAL, shape: [3, 240, 320]}
    observation.images.camera3: {type: VISUAL, shape: [3, 240, 320]}
  policy.output_features: {action: {type: ACTION, shape: [14]}}
  batch_size: 8
  dataset.repo_id: local/rmbench-cover_blocks-aloha_agilex-v30
  dataset.root: ~/.cache/huggingface/lerobot/local/rmbench-cover_blocks-aloha_agilex-v30
  dataset.video_backend: pyav
  output_dir: ../../checkpoints/lte_smolvla_cover_blocks_spatial_pool4_cache_extract
  job_name: lte_smolvla_cover_blocks_spatial_pool4_cache_extract
  wandb.enable: true
  wandb.entity: uts_robot_lab
  wandb.project: RMBench
  wandb.disable_artifact: true
  steps: 1
  save_freq: 0
  log_freq: 1
  num_workers: 8
  eval_freq: 0
  seed: 0
  rename_map:
    observation.images.cam_high: observation.images.camera1
    observation.images.cam_left_wrist: observation.images.camera2
    observation.images.cam_right_wrist: observation.images.camera3
