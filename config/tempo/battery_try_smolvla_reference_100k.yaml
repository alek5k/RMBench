# Native SmolVLA control for GLA run e84cae63; not the older grouped/LR-2.5e-5 control.
# Same optimizer/scheduler, dataset, initialization and shuffled sampler as the latest GLA run.
# No temporal modules, history auxiliary loss, or embedding-cache reads/builds.
training:
  policy_variant: smolvla
  reference_wandb_run: uts_robot_lab/RMBench/p29v0sde
  comparison_wandb_run: uts_robot_lab/RMBench/e84cae63
  allow_tf32: true
  repo_id: local/rmbench-battery_try-aloha_agilex-v30
  dataset_root: /data/RMBench-state/datasets/lerobot/local/rmbench-battery_try-aloha_agilex-v30
