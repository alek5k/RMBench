# Single-camera TEMPO ablation; SmolVLA itself still receives all three cameras.
# Otherwise identical to battery_try_smolvla_action_expert_100k.yaml.
training:
  repo_id: local/rmbench-battery_try-aloha_agilex-v30
  dataset_root: /data/RMBench-state/datasets/lerobot/local/rmbench-battery_try-aloha_agilex-v30
  pretrained_path: lerobot/smolvla_base
  pretrained_revision: 5e8d12a6e2975b0e5e5fce7c8caf47c371d257b6
  vlm_revision: 7b375e1b73b11138ff12fe22c8f2822d8fe03467
  output_dir: /data/RMBench-state/checkpoints/tempo_smolvla_battery_try_action_expert_1cam_100k
  steps: 100000
  batch_size: 8
  num_workers: 4
  history_bucket_batches: 32
  seed: 0
  learning_rate: 0.000025
  minimum_lr: 0.0000025
  warmup_steps: 1000
  weight_decay: 1.0e-10
  betas: [0.9, 0.95]
  epsilon: 1.0e-8
  grad_clip: 1.0
  save_interval: 20000
  log_interval: 10
  wandb_enabled: true
  wandb_project: RMBench
  run_name: battery_try_tempo_smolvla_action_expert_1cam_100k
  temporal_camera_keys: [observation.images.camera1]  # cam_high/front; wrists remain native VLA inputs.
  embedding_cache_dir: /data/RMBench-state/embedding_cache/smolvla_battery_try_camera1_pool2
  embedding_cache_batch_size: 64  # Camera images per batch; one image per frame for this cache.
memory:
  num_tokens: 4
  width: 64
  layers: 2
  heads: 4
  mlp_ratio: 4
  num_cameras: 1
  spatial_pool_grid: 2
  history_queries: 16
  history_loss_weight: 1.0
  max_history_frames: 2048
  vision_encode_batch_size: 64
  checkpoint_recurrence: false
