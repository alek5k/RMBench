# Fresh seed-2 run; same mild-decay 20k recipe as c556dd74, horizons 10/10.
training:
  reference_wandb_run: uts_robot_lab/RMBench/c556dd74
  task_name: waitatgoal
  env_cfg_type: temporal
  memory_backend: gla
  gla_gate_normalizer: 16.0
  allow_tf32: true
  repo_id: local/waitatgoal_v4
  dataset_root: /data/RMBench-state/datasets/waitatgoal_v4
  pretrained_path: lerobot/smolvla_base
  pretrained_revision: 5e8d12a6e2975b0e5e5fce7c8caf47c371d257b6
  vlm_revision: 7b375e1b73b11138ff12fe22c8f2822d8fe03467
  output_dir: /data/RMBench-state/checkpoints/waitatgoal_tempo_mild_lr_decay_horizon10_20k_seed2
  steps: 20000
  batch_size: 8
  num_workers: 8
  sampling: shuffle
  drop_last: false
  shared_prefix_points_per_episode: 1
  seed: 2
  chunk_size: 10  # Predict ten actions per chunk.
  n_action_steps: 10  # Execute ten actions before replanning.
  learning_rate: 0.0001
  minimum_lr: 0.000075
  scheduler: smolvla
  scheduler_decay_steps: 30000
  warmup_steps: 1000  # Native scaling: 666 effective warmup updates.
  weight_decay: 1.0e-10
  betas: [0.9, 0.95]
  epsilon: 1.0e-8
  grad_clip: 10.0
  save_interval: 10000
  log_interval: 10
  wandb_enabled: true
  wandb_log_checkpoints: false
  wandb_project: RMBench
  wandb_run_id: 1dd44cee
  wandb_group: 261106_tempo_waitatgoal_mild_lr_decay_horizon10_20k_seed2
  run_name: waitatgoal_tempo_mild_lr_decay_horizon10_20k_seed2
  temporal_camera_keys: [observation.images.camera1]
  embedding_cache_dir: /data/RMBench-state/embedding_cache/smolvla_waitatgoal_camera1_pool2
  embedding_cache_batch_size: 64
memory:
  num_tokens: 4
  width: 64
  layers: 2
  heads: 4
  mlp_ratio: 4
  num_cameras: 1
  spatial_pool_grid: 2
  history_queries: 16
  history_loss_weight: 1.0
  max_history_frames: 2048
  vision_encode_batch_size: 64
  checkpoint_recurrence: false
